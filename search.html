    function highlight(text, query) {
      if (!query) return text;
      const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(re, '<span class="search-highlight">$1</span>');
    }

    function doSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('searchResults');

      if (!query) {
        container.innerHTML = '';
        return;
      }

      const results = POSTS.filter(p =>
        p.title.toLowerCase().includes(query) ||
        p.excerpt.toLowerCase().includes(query) ||
        p.keywords.toLowerCase().includes(query) ||
        p.tag.toLowerCase().includes(query) ||
        p.date.toLowerCase().includes(query)
      );

      if (results.length === 0) {
        container.innerHTML = `
          <div class="search-empty">
            <span class="kanji">？</span>
            No posts found for "<strong>${query}</strong>".<br>Try a different keyword.
          </div>`;
        return;
      }

      container.innerHTML = `<div class="search-count">${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"</div>` +
        results.map(p => `
          <a href="posts/${p.slug}.html" class="search-result-card">
            <div class="search-result-img">
              <img src="${p.img}" alt="${p.title}" loading="lazy" />
            </div>
            <div class="search-result-body">
              <div class="search-result-meta">
                <span class="post-tag">${p.tag}</span>
                <span class="post-date">${p.date}</span>
              </div>
              <div class="search-result-title">${highlight(p.title, query)}</div>
              <div class="search-result-excerpt">${highlight(p.excerpt, query)}</div>
            </div>
          </a>`).join('');
    }

    // Search on enter key
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    // Auto-search if ?q= param in URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
      document.getElementById('searchInput').value = params.get('q');
      doSearch();
    }

    var LANGS = [

      LANGS.forEach(function(l){

        a.href = 'https://translate.google.com/translate?sl=en&tl=' + l[1] + '&u=' + encodeURIComponent(window.location.href);
        a.target = '_blank';

        container.appendChild(a);
      });
    })();
    function toggleTranslate() {
      var el = document.getElementById('translate-picker');
      if (!el) return;
      if (el.style.display === 'none' || !el.style.display) {
        var trigger = document.querySelector('.translate-toggle') ||
                      document.querySelector('.mobile-translate-btn');
        el.style.display = 'block';
        if (trigger) {
          var r = trigger.getBoundingClientRect();
          var right = window.innerWidth - r.right;
          el.style.top  = (r.bottom + window.scrollY + 8) + 'px';
          el.style.right = Math.max(8, right) + 'px';
          el.style.left  = 'auto';
        } else {
          el.style.top = '70px'; el.style.right = '1rem';
        }
      } else {
        el.style.display = 'none';
      }
    }
    document.addEventListener('click', function(e) {
      var el = document.getElementById('translate-picker');
      if (!el || el.style.display === 'none') return;
      if (!e.target.closest('#translate-picker') &&
          !e.target.closest('.translate-toggle') &&
          !e.target.closest('.mobile-translate-btn')) {
        el.style.display = 'none';
      }
    });
