name: Scheduled Post Publisher

# Runs at midnight Japan time (UTC+9 = 15:00 UTC previous day)
# Checks blog.html for any post-scheduled cards whose publish date
# has arrived, then performs the full publish flow: flip the journal
# card live, update homepage featured post, photo grid, sitemap,
# RSS feed, and search index.
on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC = 11pm JST (1hr before midnight — avoids UTC/JST date boundary issues)
  workflow_dispatch:        # also triggerable manually

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scheduled publisher
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SUPABASE_URL: https://azjwuraxixuioeddkicq.supabase.co
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: python3 .github/scripts/publish_scheduled.py

      - name: Backfill video grids
        run: python3 .github/scripts/backfill_videos.py

      - name: Backfill photo grids
        run: python3 .github/scripts/backfill_photos.py

      - name: Commit and push if anything changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to publish today."
          else
            git commit -m "Auto-publish scheduled posts for $(date +%Y-%m-%d)"
            git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/emmerjason-maker/emmerican-adventure.git main
          fi
